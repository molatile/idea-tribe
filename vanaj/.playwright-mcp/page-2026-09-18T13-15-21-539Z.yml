        - heading "The Dances of Jharkhand" [level=1] [ref=f2e16]
        - paragraph [ref=f2e17]: Rhythm as living history. Where every step tells a story of the earth, the ancestors, and the spirit of the tribe.
      - generic [ref=f2e19]:
        - generic [ref=f2e27] [cursor=pointer]:
          - heading "Ho Folk Dance" [level=3] [ref=f2e28]
          - generic [ref=f2e29]:
            - paragraph [ref=f2e30]: Tribe Ho
            - paragraph [ref=f2e31]: Region West Singhbhum
            - paragraph [ref=f2e32]: Celebrates the creation of the world and agricultural cycles. Characterized by synchronized rhythmic movements, often performed in a circle or semi-circle. It emphasizes community bonding and connection to nature.
        - generic [ref=f2e40] [cursor=pointer]:
          - heading "Oraon Folk Dance" [level=3] [ref=f2e41]
          - generic [ref=f2e42]:
            - paragraph [ref=f2e43]: Tribe Oraon
            - paragraph [ref=f2e44]: Region Ranchi, Gumla
            - paragraph [ref=f2e45]: Vibrant and energetic, honoring nature and the Karam tree. Involves complex footwork and joyous formations, typically accompanied by the rhythmic beats of the Mandar and Nagara.
        - generic [ref=f2e53] [cursor=pointer]:
          - heading "Santhali Dance" [level=3] [ref=f2e54]
          - generic [ref=f2e55]:
            - paragraph [ref=f2e56]: Tribe Santhal
            - paragraph [ref=f2e57]: Region Santhal Pargana
            - paragraph [ref=f2e58]: A vibrant and synchronized group dance, often performed with a large number of participants. Women dance in long lines holding hands, while men play traditional instruments like the Tirio (flute) and Tumdak (drum).
